<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamify - Music Player</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-box">
                <div class="logo">
                    <i class="ph-fill ph-spotify-logo"></i>
                    <span>Streamify</span>
                </div>
                <nav class="nav-links">
                    <button class="nav-item active" id="nav-home">
                        <i class="ph-fill ph-house"></i> Home
                    </button>
                    <button class="nav-item">
                        <i class="ph ph-magnifying-glass"></i> Search
                    </button>
                </nav>
            </div>
            
            <div class="sidebar-box library-box">
                <div class="library-header">
                    <i class="ph ph-books"></i>
                    <span>Your Library</span>
                    <button class="btn-icon-small"><i class="ph ph-plus"></i></button>
                </div>
                <nav class="nav-links">
                    <button class="nav-item" id="nav-favorites">
                        <i class="ph ph-heart"></i> Favorites
                    </button>
                    <button class="nav-item" id="nav-downloads">
                        <i class="ph ph-download-simple"></i> Downloads
                    </button>
                </nav>
            </div>

            <div class="auth-section">
                <div id="auth-unlogged" class="auth-box">
                    <button class="btn-primary auth-btn" id="btn-show-login">Log In</button>
                </div>
                <div id="auth-logged" class="auth-box hidden">
                    <div class="user-info">
                        <div class="avatar"><i class="ph ph-user"></i></div>
                        <span id="userStatus" class="truncate"></span>
                    </div>
                    <button class="btn-secondary auth-btn" id="btn-logout">Log Out</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input type="text" id="search" placeholder="What do you want to play?">
                </div>
            </header>

            <div class="content-area">
                <!-- HOME TAB -->
                <section id="homeTab" class="tab-content active">
                    <h2 class="section-title">Picked for you</h2>
                    <div id="results" class="grid-container">
                        <div class="empty-state">
                            <i class="ph ph-music-notes"></i>
                            <p>Search for a song or artist</p>
                        </div>
                    </div>
                </section>

                <!-- FAVORITES TAB -->
                <section id="favoritesTab" class="tab-content hidden">
                    <h2 class="section-title">Your Favorites</h2>
                    <div id="favoritesList" class="grid-container"></div>
                </section>

                <!-- DOWNLOADS TAB -->
                <section id="downloadsTab" class="tab-content hidden">
                    <h2 class="section-title">Downloads</h2>
                    <div id="downloadsList" class="list-container"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Bottom Player -->
    <div class="player-bar" id="mini-player">
        <div class="player-left">
            <img id="songThumb" src="" alt="Cover" class="now-playing-thumb hidden">
            <div class="now-playing-info">
                <div id="songTitle" class="now-playing-title">No song playing</div>
            </div>
        </div>
        
        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="btn-prev"><i class="ph-fill ph-skip-back"></i></button>
                <button class="control-btn play-btn" id="btn-toggle-play"><i class="ph-fill ph-play-circle" id="playIcon"></i></button>
                <button class="control-btn" id="btn-next"><i class="ph-fill ph-skip-forward"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime" class="time-text">0:00</span>
                <input type="range" id="progress" class="progress-slider" value="0" min="0" max="100">
                <span id="durationTime" class="time-text">0:00</span>
            </div>
        </div>
        
        <div class="player-right">
            <button class="control-btn" id="btn-toggle-mute"><i class="ph-fill ph-speaker-high" id="volumeIcon"></i></button>
            <input type="range" id="volume" class="progress-slider volume-slider" value="100" min="0" max="100">
        </div>
    </div>
    
    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav" id="mobile-nav">
        <button class="mobile-nav-item active" id="mobile-nav-home">
            <i class="ph ph-house"></i>
            <span>Home</span>
        </button>
        <button class="mobile-nav-item" id="mobile-nav-search">
            <i class="ph ph-magnifying-glass"></i>
            <span>Search</span>
        </button>
        <button class="mobile-nav-item" id="mobile-nav-library">
            <i class="ph ph-books"></i>
            <span>Library</span>
        </button>
    </nav>


    <!-- Auth Modal -->
    <div id="authModal" class="modal hidden">
        <div class="modal-overlay" id="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="btn-close-modal"><i class="ph ph-x"></i></button>
            <div class="modal-icon"><i class="ph ph-lock-key"></i></div>
            <h2 id="auth-modal-title">Log In</h2>
            <p id="auth-modal-desc">Please log in to play, favorite, or download songs.</p>
            
            <form id="auth-form" class="auth-form">
                <input type="email" id="auth-email" placeholder="Email address" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <div id="auth-error" class="auth-error hidden"></div>
                <button type="submit" class="btn-primary" id="btn-auth-submit">Log In</button>
            </form>
            
            <p class="auth-switch-text">
                <span id="auth-switch-prompt">Don't have an account?</span> 
                <button class="btn-text" id="btn-switch-auth">Sign Up</button>
            </p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Expanded Player Modal -->
    <div id="expanded-player" class="expanded-player hidden">
        <div class="expanded-player-header">
            <button class="btn-icon" id="btn-close-expanded"><i class="ph ph-caret-down"></i></button>
            <span class="expanded-header-title">Now Playing</span>
            <button class="btn-icon"><i class="ph ph-dots-three"></i></button>
        </div>
        
        <div class="expanded-artwork-container">
            <img id="expanded-thumb" src="" alt="Album Art" class="expanded-artwork">
        </div>
        
        <div class="expanded-info-actions">
            <div class="expanded-info">
                <h2 id="expanded-title" class="expanded-title truncate">No song playing</h2>
                <p id="expanded-artist" class="expanded-artist truncate">Unknown Artist</p>
            </div>
            <button class="btn-icon" id="expanded-btn-fav"><i class="ph ph-heart"></i></button>
        </div>
        
        <div class="expanded-progress-container">
            <input type="range" id="expanded-progress" class="progress-slider" value="0" min="0" max="100">
            <div class="expanded-time-texts">
                <span id="expanded-currentTime">0:00</span>
                <span id="expanded-durationTime">0:00</span>
            </div>
        </div>
        
        <div class="expanded-controls">
            <button class="control-btn" id="btn-shuffle"><i class="ph ph-shuffle"></i></button>
            <button class="control-btn btn-large" id="expanded-btn-prev"><i class="ph-fill ph-skip-back"></i></button>
            <button class="control-btn play-btn play-btn-large" id="expanded-btn-toggle-play"><i class="ph-fill ph-play-circle" id="expanded-playIcon"></i></button>
            <button class="control-btn btn-large" id="expanded-btn-next"><i class="ph-fill ph-skip-forward"></i></button>
            <button class="control-btn" id="btn-repeat"><i class="ph ph-repeat"></i></button>
        </div>
        
        <div class="expanded-bottom-actions">
            <button class="btn-icon"><i class="ph ph-devices"></i></button>
            <button class="btn-icon"><i class="ph ph-queue"></i></button>
        </div>
    </div>

    <audio id="player"></audio>
    <script type="module" src="app.js"></script>
</body>
</html>
